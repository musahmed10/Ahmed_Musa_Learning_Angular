<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()" >
  <!-- Name Field -->
  <div>
    <label matBadge="*" matBadgeOverlap="false" class="demo-section" for="name"
           mat-raised-button
           matTooltip="Name of product">Name:</label>
    <input id="name" formControlName="name" appHighlightOnFocus [appHoverHighlight]="'lightblue'"/>
    <div *ngIf="modifyForm.get('name')?.invalid && modifyForm.get('name')?.touched">
      <small *ngIf="modifyForm.get('name')?.errors?.['required']">Name is required</small>
      <small *ngIf="modifyForm.get('name')?.errors?.['specialChars']">Name cannot contain special characters (#, ?, !)</small>
      <small *ngIf="modifyForm.errors?.['duplicate']">Product name must be unique</small>
    </div>
  </div>

  <!-- Price Field -->

  <div>
    <mat-label matBadge="*" matBadgeOverlap="false" class="demo-section"
               mat-raised-button
               matTooltip="Price of the product">Price:</mat-label>
    <input id="price" matInput type="number" formControlName="price" placeholder="0"/>
    <div *ngIf="modifyForm.get('price')?.invalid && modifyForm.get('price')?.touched">
      <small *ngIf="modifyForm.get('price')?.errors?.['required']">Price is required</small>
      <small *ngIf="modifyForm.get('price')?.errors?.['min']">Price must be a positive number</small>
      <small *ngIf="modifyForm.get('price')?.errors?.['pattern']">Price must be a valid number</small>
      </div>
    </div>


  <!-- Description Field -->
  <div>
    <label for="description"
           mat-raised-button
           matTooltip="Description of product">Description:</label>
    <textarea id="description" formControlName="description" matInput placeholder="write a description..."></textarea>
  </div>

  <!-- Availability Checkbox -->
  <div>
    <label for="isAvailable"
           mat-raised-button
           matTooltip="Availability of product">Available:</label>
    <mat-checkbox id="isAvailable" type="checkbox" formControlName="isAvailable" />
  </div>

  <!-- Image URL Field -->
  <div>
    <label for="imageUrl"
           mat-raised-button
           matTooltip="Link to product's image">Image URL:</label>
    <input id="imageUrl" formControlName="imageUrl" />
  </div>

  <!-- Submit Button -->

  <button type="submit" [disabled]="modifyForm.invalid">Save</button>

  <!-- Reset Form Button -->
  <button type="button" (click)="onReset()"
          mat-raised-button
          matTooltip="Click to reset form">Reset</button>

</form>
