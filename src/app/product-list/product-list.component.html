<mat-card appearance="outlined">
  <mat-card-content>
<mat-list>
  <div *ngIf="products$ | async as productList">
  <div *ngFor="let product of productList; let i = index" [routerLink]="['/products',product.name ]" [appHoverHighlight]="'grey'"
       [ngClass]="{'even-item': i % 2 === 0, 'odd-item': i % 2 !== 0}">
    <mat-list-item><h3>{{ product.name | uppercase}}</h3></mat-list-item>
    <mat-divider></mat-divider>
    <p>Price: {{ product | fiftyPercentPromo | currency: 'CAD'}} </p>

    <p *ngIf="product.description">Description: {{ product.description | lowercase}}</p>
    <p *ngIf="!product.isAvailable" [ngClass]="product.isAvailable | availabilityColors">Out of Stock</p>

    <!-- Add the image here -->
    <img *ngIf="product.imageUrl" [src]="product.imageUrl" alt="{{ product.name }}" class="product-image" />

    <!-- Buttons for the list view -->
    <button (click)="editProduct(product)">Edit</button>
    <button (click)="deleteProduct(i)">Delete</button>


      <a> <mat-icon></mat-icon>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M440-600v-120H320v-80h120v-120h80v120h120v80H520v120h-80ZM280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/></svg>
      </a>



  </div>

  <mat-paginator [length]="100"
                 [pageSize]="10"
                 [pageSizeOptions]="[5, 10, 25, 100]"
                 aria-label="Select page">
  </mat-paginator>
</div>
</mat-list>
  </mat-card-content>
</mat-card>
